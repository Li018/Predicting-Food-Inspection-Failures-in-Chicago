[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-food-inspections"
version = "1.0.0"
description = "Point-in-time prediction of Chicago routine food inspection failures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<1.9", "lightgbm==4.6.0", "shap==0.49.1",
  "pyarrow==22.0.0", "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14",
  "joblib>=1.4,<2", "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
